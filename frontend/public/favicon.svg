<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark charcoal circle background -->
  <circle cx="32" cy="32" r="32" fill="#1e1c1a"/>

  <!-- Crab body (oval) -->
  <ellipse cx="32" cy="34" rx="12" ry="9" fill="#c9a96e"/>

  <!-- Crab claws - left -->
  <path d="M20 34 Q10 28 8 22 Q12 20 14 25 Q16 22 18 26 Z" fill="#c9a96e"/>
  <!-- Crab claws - right -->
  <path d="M44 34 Q54 28 56 22 Q52 20 50 25 Q48 22 46 26 Z" fill="#c9a96e"/>

  <!-- Legs - left side -->
  <line x1="22" y1="36" x2="12" y2="42" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="21" y1="38" x2="11" y2="46" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="40" x2="14" y2="50" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs - right side -->
  <line x1="42" y1="36" x2="52" y2="42" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43" y1="38" x2="53" y2="46" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="40" x2="50" y2="50" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes on stalks -->
  <line x1="27" y1="26" x2="25" y2="22" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="25" cy="21" r="2.5" fill="#c9a96e"/>
  <line x1="37" y1="26" x2="39" y2="22" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="39" cy="21" r="2.5" fill="#c9a96e"/>

  <!-- "G" letter on body -->
  <text x="32" y="37" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1e1c1a">G</text>
</svg>
